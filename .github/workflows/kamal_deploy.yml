name: deploy instance with kamal

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        type: choice
        required: true
        options:
          - avd-staging
          - avd-production
      ref:
        description: "Git ref to deploy (branch, tag, or SHA)"
        required: false
        default: "main"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_STORAGE_DIR: ${{ vars.DEPLOY_STORAGE_DIR }}
          DEPLOY_DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
          DEPLOY_ARCH: ${{ vars.DEPLOY_ARCH || 'amd64' }}
          MYSQL_DATABASE: ${{ vars.MYSQL_DATABASE }}
          MYSQL_USER: ${{ vars.MYSQL_USER }}
          DATACITE_PREFIX: ${{ vars.DATACITE_PREFIX }}
          DATACITE_CLIENT_ID: ${{ vars.DATACITE_CLIENT_ID }}
          DATACITE_URL: ${{ vars.DATACITE_URL }}
          OHD_EXTRA_HOSTS: ${{ vars.OHD_EXTRA_HOSTS || vars.DEPLOY_DOMAIN }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          DATACITE_PASSWORD: ${{ secrets.DATACITE_PASSWORD }}
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          OIDC_SIGNING_KEY: ${{ secrets.OIDC_SIGNING_KEY }}
          CERTIFICATE_PEM: ${{ secrets.CERTIFICATE_PEM }}
          PRIVATE_KEY_PEM: ${{ secrets.PRIVATE_KEY_PEM }}
        run: |
          bin/kamal deploy -d "${{ inputs.target }}"

<%#
  Destination "avd-staging". Deep-merged over config/deploy.yml.

  To add a server: copy this file to config/deploy.<name>.yml, change the values
  in the block below, add .kamal/secrets.<name>, then see bin/server/README.md.
%>
<%
  ssh_user = "avd1"                                     # deploy user on the server
  home     = "/home/#{ssh_user}"                        # its home directory
  storage  = "#{home}/avd/storage"                      # app volumes live here
  host_ip  = "160.45.152.195"
  domain   = "staging.audio-visual.digital"
  arch     = "amd64"                                    # builder arch of the server
%>
servers:
  web:
    - "<%= host_ip %>"
  job:
    hosts:
      - "<%= host_ip %>"
    cmd: bundle exec rake jobs:work

env:
  clear:
    SENTRY_DISABLED: "true"
    OHD_DOMAIN_PRODUCTION: "https://<%= domain %>"
    OHD_DOMAIN: "https://<%= domain %>"
    OHD_EXTRA_HOSTS_PRODUCTION: "<%= domain %>,avd-test.ub.fu-berlin.de"

proxy:
  host: <%= domain %>
  app_port: 3000
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM

volumes:
  - "<%= storage %>/app-cache:/app/tmp/cache"
  - "<%= storage %>/app-files:/app/tmp/files"
  - "<%= storage %>/app-logs:/app/log"

ssh:
  user: <%= ssh_user %>

builder:
  arch: <%= arch %>

accessories:
  db:
    hosts:
      - "<%= host_ip %>"
  solr:
    hosts:
      - "<%= host_ip %>"

servers:
  web:
    - 160.45.152.195

proxy:
  host: avd-test.ub.fu-berlin.de
  app_port: 3000
  ssl:
    certificate_pem: CERTIFICATE_PEM
    private_key_pem: PRIVATE_KEY_PEM

volumes:
  - "/home/avd1/avd/storage/app-cache:/app/tmp/cache"
  - "/home/avd1/avd/storage/app-files:/app/tmp/files"
  - "/home/avd1/avd/storage/app-logs:/app/log"

ssh:
  user: avd1

accessories:
  db:
    image: mariadb:10.5
    hosts:
      - 160.45.152.195
    env:
      clear:
        MARIADB_DATABASE: ohd_production
        MARIADB_USER: ohd
      secret:
        - MARIADB_ROOT_PASSWORD
        - MARIADB_PASSWORD
    directories:
      - data:/var/lib/mysql

  solr:
    image: solr:5.5
    hosts:
      - 160.45.152.195
    directories:
      - solr_data:/opt/solr/server/solr/mycores

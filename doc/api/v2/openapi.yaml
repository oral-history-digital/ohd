---
openapi: 3.1.0
info:
  title: Oral-History.Digital API v2
  version: '2'
  description: |
    JSON API for Oral-History.Digital application data.
    Each operation documents its parameters, response schemas, and access rules.
paths:
  "/api/v2/projects":
    get:
      summary: List visible project summaries
      operationId: listProjects
      description: |
        Results follow the current account's project policy scope. Anonymous requests
        return public projects. The request host does not restrict the project list.
        Defaults to created_at descending, then ID descending. Use sort to change ordering.
        Both extensionless requests and the .json suffix are supported.
        Translated display values use the requested locale, then the project's
        default locale, then the first nonblank translation by translation ID.
        Optional includes add catalog data to each returned summary. Profile is
        unsupported and returns 400. Other unrecognized query parameters are ignored.
      parameters:
      - name: include
        in: query
        schema:
          type: string
          pattern: "^\\s*(counts|institutions|interview_languages|collection_preview)\\s*(,\\s*(counts|institutions|interview_languages|collection_preview)\\s*)*$"
        example: counts,institutions,interview_languages,collection_preview
        description: |
          Comma-separated optional additions. Counts adds interview_counts and
          collection_counts; the other names add fields with the same name.
          Whitespace, duplicate names, and any ordering are accepted. Empty,
          unknown, and non-string values return 400. Omit for base summaries.
          Counts and interview languages retain catalog aggregate rules, including
          unshared interview statistics. Collection previews include only collections
          visible through policy scope, including unshared collections for authorized editors.
          Optional queries are limited to projects on the returned page.
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - name
          - "-name"
          - shortname
          - "-shortname"
          - created_at
          - "-created_at"
          - publication_date
          - "-publication_date"
          - id
          - "-id"
          default: "-created_at"
        description: |
          Sorts before pagination. A leading minus selects descending order.
          Name uses the localized display_name, falling back to the localized name,
          with the same translation fallback as the response fields. Name sorting
          ignores leading punctuation and whitespace; response values are unchanged.
          Shortname sorts the routing identifier, not display_shortname.
          Text uses the database's
          case/accent-insensitive collation; publication_date sorts as stored text.
          Null names and publication dates sort last in either direction.
          ID breaks ties in the requested direction. Only one sort field is accepted.
      - name: locale
        in: query
        schema:
          type: string
          enum:
          - en
          - de
          - ru
          - el
          - es
          - uk
          - ar
          - tr
        description: |
          Defaults to the current request locale, initialized from the application
          default locale. It need not occur in a project's available_locales.
          Explicit empty or unsupported values return 400.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: |
          One-based page. Out-of-range pages return an empty data array and retain
          the requested page and actual totals. Cannot be supplied with all=true.
          Only positive decimal integer strings are accepted in the query string.
      - name: per_page
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: |
          Maximum results per page. Cannot be supplied with all=true.
          Only positive decimal integer strings are accepted in the query string.
      - name: all
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Returns all matching projects in one page. Only the literal query values
          true and false are accepted. With true, page and per_page must be omitted,
          even if they contain default or empty values.
      - name: include_umbrella
        in: query
        schema:
          type: boolean
          default: false
        description: |
          Includes the umbrella project configured in instance settings, subject
          to the same policy scope. Only true and false are accepted.
      - name: workflow_state
        in: query
        schema:
          type: string
          pattern: "^(all|\\s*(public|unshared)\\s*(,\\s*(public|unshared)\\s*)*)$"
          default: all
        example: public
        description: |
          Filters the authorized results. Accepts public, unshared, comma-separated
          combinations of those states, or all for no additional filtering.
          Combinations may contain whitespace and repeated states. Empty or unknown
          states return 400. This filter never grants access to hidden projects.
      responses:
        '200':
          description: Visible project summaries and pagination metadata
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectListResponse"
          headers:
            Content-Language:
              description: Effective locale used for the response
              schema:
                type: string
        '400':
          description: An invalid or unsupported query parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InvalidParameterResponse"
              examples:
                example:
                  value:
                    error:
                      code: invalid_parameter
                      message: Invalid value for per_page.
                      parameter: per_page
        '406':
          description: An explicit non-JSON format, such as .html
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FormatErrorResponse"
  "/api/v2/projects/{identifier}":
    parameters:
    - name: identifier
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Decimal values resolve to numeric project IDs; other values resolve
        to exact shortnames. Independent of request host.
    get:
      summary: Read project details
      operationId: getProject
      description: |
        The default display profile requires show authorization for the target project.
        Anonymous requests can read public projects. Project members with granted
        access, project role holders, and admins can read authorized unshared projects.
        Establishes target project context independently of the request host.
        Localized values use requested locale, project default, then first nonblank
        translation by translation ID. The edit profile requires update permission
        and adds project settings. Shared field types remain unchanged. Only edit
        supports include=translations, returning stored translation records with IDs,
        all seven translated fields, and no locale fallback. Rich text must be sanitized
        before rendering. Related-record editors and mutation endpoints are separate.
        Supports extensionless and .json requests. Unsupported profiles return 400.
        Other unrecognized query parameters are ignored.
      parameters:
      - name: locale
        in: query
        schema:
          type: string
          enum:
          - en
          - de
          - ru
          - el
          - es
          - uk
          - ar
          - tr
        description: Defaults to the current request locale. Empty or unsupported
          values return 400; independent of project available_locales.
      - name: profile
        in: query
        schema:
          type: string
          enum:
          - display
          - edit
          default: display
        description: Display requires show permission; edit requires update permission,
          including for public projects. Omitted profile means display.
      - name: include
        in: query
        schema:
          type: string
          pattern: "^\\s*(counts|institutions|interview_languages|collection_preview|media_types|year_ranges|subjects|levels_of_indexing|affiliates|access_config|metadata_fields|registry_configuration|playback|footer|branding|external_links|translations)\\s*(,\\s*(counts|institutions|interview_languages|collection_preview|media_types|year_ranges|subjects|levels_of_indexing|affiliates|access_config|metadata_fields|registry_configuration|playback|footer|branding|external_links|translations)\\s*)*$"
        description: |
          Same optional fields as the list endpoint: counts adds interview_counts
          and collection_counts; other names add their matching fields. Defaults
          to no includes. Duplicate names, whitespace and any ordering are accepted.
          Empty, unknown and non-string values return 400. Collection previews are
          policy-scoped to the target project; aggregates retain catalog counting rules.
          Use include=institutions for ProjectHome's institution names.
          Detail-only includes: media_types adds audio/video counts; year_ranges
          adds interview_year_range and birth_year_range; subjects and
          levels_of_indexing add localized umbrella registry labels linked to this
          project's interviews. Affiliates adds cooperation_partners, leaders,
          managers and funders with localized display names, ordered by ID.
          With profile=edit, affiliates additionally requires update permission for
          CooperationPartner, Leader, Manager and Funder. Each record adds stored
          translations (id, locale, name, first_name, last_name), ordered by ID and
          preserving blanks and nulls without fallback. Localized display fields
          retain their existing shapes and fallback rules in both profiles.
          Access_config adds boolean registration field settings without user answers;
          edit additionally includes the save identifier. Missing configuration is null.
          Metadata_fields adds field definitions ordered by ID, localized labels,
          reference IDs, display flags and ordering. Derive grid fields using
          use_in_results_table and list columns using use_in_results_list, sorted
          by list_columns_order. No registry trees or interview values are included.
          Edit additionally returns use_in_metadata_import and stored label
          translations with IDs, preserving blanks and nulls without fallback.
          Registry_configuration adds root_registry_entry_id (null when absent),
          logged_out_visible_registry_entry_ids and hidden_registry_entry_ids.
          IDs in visibility arrays remain strings. These are UI settings, not
          authorization for registry records. Transcript visibility settings remain
          edit-only; existing edit settings are returned even without this include.
          Playback adds media_streams ordered by ID (including still images) and
          localized media_missing_text. Display streams contain id, media_type,
          resolution and suffix only. Clients build URLs through the existing
          media route; stream descriptors do not grant media or HLS-key access.
          Edit adds path templates and additionally requires MediaStream update
          permission. Missing streams return []; absent custom text returns null
          so clients can use their standard message. Full stored message translations
          remain available through the edit-only translations include.
          Footer adds external_links (id, localized name and url) and sponsor_logos
          (id, locale, href, title and relative image url), each ordered by ID.
          Sponsor logos match the requested locale exactly; unattached logos are
          omitted. Missing data returns empty arrays. Both profiles use this display
          projection; stored editing names and translations are not included.
          Branding is edit-only and additionally requires Logo and SponsorLogo
          update permission. It adds logos and sponsor_logos across all locales,
          including null locales and unattached records, ordered by ID. Records
          contain id, type, locale, href, title, url and filename; missing attachments
          use null url and filename. Empty lists return []. When combined with
          footer, sponsor_logos appears once using the complete editable projection;
          footer-only reads retain the existing locale-filtered display projection.
          External_links is edit-only and additionally requires ExternalLink update
          permission. It adds links ordered by ID with localized name/url fields,
          internal_name and stored translations (id, locale, name, url), preserving
          blanks and nulls without fallback. Missing links return []. Combined
          footer,external_links requests emit links once using the edit projection;
          footer-only reads keep their display fields in both profiles.
          Media and year aggregates retain existing catalog rules: public projects
          include unshared interviews; other project states return zeros or null bounds.
          Requested empty data uses empty arrays, zero counts or null year bounds.
          Translations, branding and external_links are accepted only with profile=edit; display requests return 400.
      responses:
        '200':
          description: Authorized project details for the requested profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectDetailResponse"
          headers:
            Content-Language:
              description: Effective response locale
              schema:
                type: string
        '400':
          description: Invalid locale, profile or include parameter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InvalidParameterResponse"
        '403':
          description: Existing project is not accessible
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectReadErrorResponse"
        '404':
          description: No project matches the identifier
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectReadErrorResponse"
        '406':
          description: An explicit non-JSON format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FormatErrorResponse"
components:
  schemas:
    CollectionCounts:
      type: object
      additionalProperties: false
      description: Catalog aggregates include public and restricted states, not unshared
        collections. Independent of preview visibility.
      required:
      - public
      - restricted
      - total
      properties:
        public:
          type: integer
          minimum: 0
        restricted:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
      title: CollectionCounts
    CollectionPreview:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - notes
      description: Search metadata for a policy-visible collection; not a complete
        collection record
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type:
          - string
          - 'null'
        notes:
          type:
          - string
          - 'null'
      title: CollectionPreview
    FormatErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          properties:
            code:
              const: not_acceptable
            message:
              type: string
              minLength: 1
      title: FormatErrorResponse
    InterviewCounts:
      type: object
      additionalProperties: false
      description: Catalog aggregates for public projects, including unshared interview
        counts. Other project states return zeros.
      required:
      - public
      - restricted
      - unshared
      - total
      properties:
        public:
          type: integer
          minimum: 0
        restricted:
          type: integer
          minimum: 0
        unshared:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
      title: InterviewCounts
    InvalidParameterResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - parameter
          properties:
            code:
              const: invalid_parameter
            message:
              type: string
              minLength: 1
            parameter:
              type: string
              minLength: 1
      title: InvalidParameterResponse
    MetadataFieldTranslation:
      type: object
      additionalProperties: false
      required:
      - id
      - locale
      - label
      properties:
        id:
          type: integer
          minimum: 1
        locale:
          type: string
        label:
          type:
          - string
          - 'null'
      title: MetadataFieldTranslation
    Pagination:
      type: object
      additionalProperties: false
      description: |
        In paginated mode, total_pages is zero for an empty result. With all=true,
        page and total_pages are 1 and per_page equals total_count, including zero
        for an empty result. Totals reflect policy scope and filters.
      required:
      - page
      - per_page
      - total_pages
      - total_count
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        total_count:
          type: integer
          minimum: 0
      title: Pagination
    ProjectAccessConfig:
      type:
      - object
      - 'null'
      additionalProperties: false
      required:
      - organization
      - job_description
      - research_intentions
      - specification
      - tos_agreement
      properties:
        organization:
          type: object
          additionalProperties: false
          required:
          - display
          - obligatory
          properties:
            display:
              type: boolean
            obligatory:
              type: boolean
        job_description:
          type: object
          additionalProperties: false
          required:
          - display
          - obligatory
          - values
          properties:
            display:
              type: boolean
            obligatory:
              type: boolean
            values:
              type: object
              additionalProperties: false
              required:
              - researcher
              - filmmaker
              - journalist
              - teacher
              - memorial_staff
              - pupil
              - student
              - other
              properties:
                researcher:
                  type: boolean
                filmmaker:
                  type: boolean
                journalist:
                  type: boolean
                teacher:
                  type: boolean
                memorial_staff:
                  type: boolean
                pupil:
                  type: boolean
                student:
                  type: boolean
                other:
                  type: boolean
        research_intentions:
          type: object
          additionalProperties: false
          required:
          - display
          - obligatory
          - values
          properties:
            display:
              type: boolean
            obligatory:
              type: boolean
            values:
              type: object
              additionalProperties: false
              required:
              - exhibition
              - education
              - film
              - memorial_culture_project
              - genealogy
              - art
              - personal_interest
              - press_publishing
              - school_project
              - university_teaching
              - scientific_paper
              - other
              properties:
                exhibition:
                  type: boolean
                education:
                  type: boolean
                film:
                  type: boolean
                memorial_culture_project:
                  type: boolean
                genealogy:
                  type: boolean
                art:
                  type: boolean
                personal_interest:
                  type: boolean
                press_publishing:
                  type: boolean
                school_project:
                  type: boolean
                university_teaching:
                  type: boolean
                scientific_paper:
                  type: boolean
                other:
                  type: boolean
        specification:
          type: object
          additionalProperties: false
          required:
          - display
          - obligatory
          properties:
            display:
              type: boolean
            obligatory:
              type: boolean
        tos_agreement:
          type: object
          additionalProperties: false
          required:
          - display
          - obligatory
          properties:
            display:
              type: boolean
            obligatory:
              type: boolean
      title: ProjectAccessConfig
    ProjectAffiliate:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - name_type
      - name
      - first_name
      - last_name
      properties:
        id:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
          - CooperationPartner
          - Leader
          - Manager
          - Funder
        name_type:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
          description: Display name; personal names combine first_name and last_name
        first_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
      title: ProjectAffiliate
    ProjectAffiliateTranslation:
      type: object
      additionalProperties: false
      required:
      - id
      - locale
      - name
      - first_name
      - last_name
      properties:
        id:
          type: integer
          minimum: 1
        locale:
          type: string
        name:
          type:
          - string
          - 'null'
        first_name:
          type:
          - string
          - 'null'
        last_name:
          type:
          - string
          - 'null'
      title: ProjectAffiliateTranslation
    ProjectDetailResponse:
      type: object
      additionalProperties: false
      required:
      - data
      properties:
        data:
          oneOf:
          - "$ref": "#/components/schemas/ProjectDisplay"
          - "$ref": "#/components/schemas/ProjectEdit"
      title: ProjectDetailResponse
    ProjectDisplay:
      type: object
      additionalProperties: false
      description: Localized public display details, including the fields used by
        ProjectHome. Institutions remain an optional include.
      required:
      - id
      - shortname
      - is_umbrella
      - name
      - display_name
      - display_shortname
      - archive_domain
      - workflow_state
      - publication_date
      - available_locales
      - default_locale
      - introduction
      - logo
      - favicon_url
      - grant_access_without_login
      - grant_project_access_instantly
      - domain
      - more_text
      - primary_color
      - secondary_color
      - editorial_color
      - has_map
      - is_catalog
      - has_newsletter
      - display_ohd_link
      - show_preview_img
      - oai_doi_identifier
      - view_modes
      - default_search_order
      - aspect_x
      - aspect_y
      properties:
        id:
          type: integer
          minimum: 1
        shortname:
          type: string
          description: Project identifier used by UI routes
        is_umbrella:
          type: boolean
        name:
          type:
          - string
          - 'null'
        display_name:
          type:
          - string
          - 'null'
        display_shortname:
          type:
          - string
          - 'null'
          description: Optional label, independent of the routing shortname
        archive_domain:
          type:
          - string
          - 'null'
          description: Dedicated archive domain; blank stored values become null
        workflow_state:
          type: string
          enum:
          - public
          - unshared
        publication_date:
          type:
          - string
          - 'null'
          description: Stored publication label; not an ISO date value
        available_locales:
          type: array
          items:
            type: string
          description: Locales available for the project (ISO 639-1 language codes)
        default_locale:
          type:
          - string
          - 'null'
          description: Default locale for the project (ISO 639-1 language code); null
            if no default is set
        introduction:
          type:
          - string
          - 'null'
          description: Localized rich text; consumers must sanitize before rendering
            HTML
        logo:
          type:
          - object
          - 'null'
          additionalProperties: false
          description: |
            Logo for the requested locale, then the project default locale, then
            the first logo by ID. Null if the selected logo has no attachment.
          required:
          - id
          - url
          properties:
            id:
              type: integer
              minimum: 1
            url:
              type: string
              description: Relative attachment URL
        favicon_url:
          type:
          - string
          - 'null'
          description: Relative attachment URL, or null when no favicon is attached
        grant_access_without_login:
          type: boolean
          description: Whether project access is granted without login; unset means
            false
        grant_project_access_instantly:
          type: boolean
          description: Whether logged-in users receive project access immediately;
            unset means false
        interview_counts:
          "$ref": "#/components/schemas/InterviewCounts"
        collection_counts:
          "$ref": "#/components/schemas/CollectionCounts"
        institutions:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectInstitution"
        interview_languages:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Sorted language codes such as eng, from public/restricted/unshared
            interviews in public projects; other project states return an empty array
        collection_preview:
          type: array
          items:
            "$ref": "#/components/schemas/CollectionPreview"
        domain:
          type:
          - string
          - 'null'
        more_text:
          type:
          - string
          - 'null'
          description: Localized rich text; sanitize before rendering HTML
        primary_color:
          type:
          - string
          - 'null'
        secondary_color:
          type:
          - string
          - 'null'
        editorial_color:
          type:
          - string
          - 'null'
        has_map:
          type: boolean
        is_catalog:
          type: boolean
        has_newsletter:
          type: boolean
        display_ohd_link:
          type: boolean
        show_preview_img:
          type: boolean
          description: Show interview preview images even without project access
        oai_doi_identifier:
          type:
          - string
          - 'null'
          description: DOI URL only when doi_status is created; otherwise null
        view_modes:
          type: array
          items:
            type: string
        default_search_order:
          type:
          - string
          - 'null'
          enum:
          - title
          - random
          - archive_id
          -
        aspect_x:
          type:
          - integer
          - 'null'
        aspect_y:
          type:
          - integer
          - 'null'
        access_config:
          "$ref": "#/components/schemas/ProjectAccessConfig"
        metadata_fields:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectMetadataField"
        media_streams:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectMediaStream"
        external_links:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectExternalLink"
        sponsor_logos:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectSponsorLogo"
        media_missing_text:
          type:
          - string
          - 'null'
          description: Localized custom rich text; sanitize before rendering. Null
            means use the standard UI message.
        root_registry_entry_id:
          type:
          - integer
          - 'null'
          description: Target project root entry, or null when absent
        logged_out_visible_registry_entry_ids:
          type: array
          items:
            type: string
        hidden_registry_entry_ids:
          type: array
          items:
            type: string
        media_types:
          type: object
          additionalProperties: false
          required:
          - audio
          - video
          properties:
            audio:
              type: integer
              minimum: 0
            video:
              type: integer
              minimum: 0
        interview_year_range:
          "$ref": "#/components/schemas/YearRange"
        birth_year_range:
          "$ref": "#/components/schemas/YearRange"
        subjects:
          type: array
          items:
            type: string
        levels_of_indexing:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - descriptor
            - count
            properties:
              descriptor:
                type:
                - string
                - 'null'
              count:
                type: integer
                minimum: 0
        cooperation_partners:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectAffiliate"
        leaders:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectAffiliate"
        managers:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectAffiliate"
        funders:
          type: array
          items:
            "$ref": "#/components/schemas/ProjectAffiliate"
      title: ProjectDisplay
    ProjectEdit:
      type: object
      additionalProperties: false
      description: Project settings requiring update permission. Display fields retain
